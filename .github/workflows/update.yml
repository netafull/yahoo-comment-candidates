name: Update comment candidates feed

on:
  schedule:
    # 6時間おき。1回の実行で「コンビニ」は約8.6時間分しかさかのぼれないため、
    # 実行間隔をそれより短くしないと取りこぼしが出る（実測値に基づく）
    - cron: "0 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "件数が大きく減っても保存する（キーワードや除外語を意図的に絞ったとき用）"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # 収集結果は積み増し方式のため、前回分を引き継ぐ必要がある。
      # ただし履歴は不要なので、mainではなく data ブランチに常に1コミットだけ置く。
      - name: Restore previous data
        run: |
          mkdir -p data

          # GitHub Actionsのrunステップはデフォルトで `set -e` が有効なため、
          # 終了コードで分岐したいコマンドはif の条件式の中で実行する
          # (単独で実行してから $? を見ると、失敗時点でシェルごと落ちてしまう)。
          if git ls-remote --exit-code --heads origin data; then
            ls_remote_status=0
          else
            ls_remote_status=$?
          fi

          if [ "$ls_remote_status" -eq 0 ]; then
            # data ブランチが存在する → 復元できなければジョブを失敗させる。
            # ここを握りつぶすと、通信の瞬断を「初回実行」と誤認し、
            # 直後の force-push で積み増したデータを消してしまう。
            if git fetch --depth=1 origin data && git show FETCH_HEAD:candidates.json > data/candidates.json; then
              echo "前回データを復元しました"
            else
              echo "::error::data ブランチはあるのに復元に失敗しました。積み増しデータを失う恐れがあるため中断します。" >&2
              exit 1
            fi
          elif [ "$ls_remote_status" -eq 2 ]; then
            echo "前回データなし（初回実行）"
          else
            echo "::error::git ls-remote が異常終了しました (exit $ls_remote_status)。通信エラーの可能性があるため中断します。" >&2
            exit 1
          fi

      # 件数が急減すると収集スクリプトが異常終了してデータを守る。
      # 設定を意図的に絞った場合は、手動実行時に allow_shrink を有効にして通す。
      - name: Fetch candidates
        run: python scripts/fetch_candidates.py
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '0' }}

      # 毎回まっさらな単一コミットとして強制上書きするので、履歴は増えない
      - name: Save data
        run: |
          tmp="$(mktemp -d)"
          cp data/candidates.json "$tmp/"
          cd "$tmp"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b data
          git add candidates.json
          git commit -q -m "candidates data ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST'))"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      - name: Generate site
        run: python scripts/generate_site.py

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
